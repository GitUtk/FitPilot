name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Extract App Version from build.gradle
        id: app_info
        run: |
          VERSION=$(grep "versionName" FitPilotNative/app/build.gradle | sed 's/.*versionName "//; s/".*//')
          VERSION_CODE=$(grep "versionCode" FitPilotNative/app/build.gradle | sed 's/[^0-9]//g')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Extracted App Version: $VERSION (Build: $VERSION_CODE)"

      - name: Decode Release Keystore Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > FitPilotNative/app/release.keystore
          echo "Keystore successfully decoded and placed"

      - name: Build Android Release APK
        working-directory: FitPilotNative
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PKEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASS="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Version and Rename APK file
        run: |
          APK_DIR="FitPilotNative/app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            mv "$APK_DIR/app-release.apk" "$APK_DIR/FitPilot-V${{ env.VERSION }}.apk"
            echo "APK_PATH=$APK_DIR/FitPilot-V${{ env.VERSION }}.apk" >> $GITHUB_ENV
            echo "Renamed signed release APK"
          else
            mv "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/FitPilot-V${{ env.VERSION }}-unsigned.apk"
            echo "APK_PATH=$APK_DIR/FitPilot-V${{ env.VERSION }}-unsigned.apk" >> $GITHUB_ENV
            echo "Renamed unsigned release APK"
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitPilot-V${{ env.VERSION }}
          path: ${{ env.APK_PATH }}

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FitPilot-V${{ env.VERSION }}
          name: FitPilot-V${{ env.VERSION }}
          draft: false
          prerelease: false
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
