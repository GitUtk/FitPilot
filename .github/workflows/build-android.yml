name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Project Dependencies
        working-directory: mobile
        run: npm ci

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Extract App Version from Configuration
        id: app_info
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Extracted App Version: $VERSION (Build: $VERSION_CODE)"

      - name: Generate Native Android Directory (Expo Prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Decode Release Keystore Signature
        if: env.VERSION != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/release.keystore
          echo "✅ Keystore successfully decoded and placed"

      - name: Inject Release Signing Configuration
        run: |
          python3 - << 'EOF'
          build_gradle_path = "mobile/android/app/build.gradle"
          with open(build_gradle_path, "r") as file:
              content = file.read()

          # Normalize newlines
          content = content.replace("\r\n", "\n")

          # 1. Define release signing configuration block
          old_signing = (
              "    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('debug.keystore')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "    }"
          )

          new_signing = (
              "    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('debug.keystore')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "        release {\n"
              "            storeFile file(\"release.keystore\")\n"
              "            storePassword project.findProperty(\"KEYSTORE_PASS\") ?: \"\"\n"
              "            keyAlias project.findProperty(\"KEY_ALIAS\") ?: \"\"\n"
              "            keyPassword project.findProperty(\"KEY_PASS\") ?: \"\"\n"
              "        }\n"
              "    }"
          )

          if old_signing in content:
              content = content.replace(old_signing, new_signing)
              print("✅ Injected release signing config block")
          elif "signingConfigs {" in content and "KEYSTORE_PASS" in content:
              print("ℹ️ Release signing config block already exists")
          else:
              print("⚠️ Could not find standard signingConfigs block, trying fallback")
              if "signingConfigs {" in content:
                  content = content.replace(
                      "signingConfigs {",
                      "signingConfigs {\n        release {\n            storeFile file(\"release.keystore\")\n            storePassword project.findProperty(\"KEYSTORE_PASS\") ?: \"\"\n            keyAlias project.findProperty(\"KEY_ALIAS\") ?: \"\"\n            keyPassword project.findProperty(\"KEY_PASS\") ?: \"\"\n        }"
                  )
                  print("✅ Applied fallback injection for signingConfigs.release")

          # 2. Assign release signing config to release build type
          release_build_type_target = "signingConfig signingConfigs.debug"
          release_build_type_replacement = "signingConfig signingConfigs.release"
          
          # Find release build type block and replace signingConfig
          build_types_split = content.split("buildTypes {")
          if len(build_types_split) > 1:
              build_types_part = build_types_split[1]
              # Find release block inside buildTypes
              release_split = build_types_part.split("release {")
              if len(release_split) > 1:
                  release_subpart = release_split[1]
                  if release_build_type_target in release_subpart:
                      # Replace only the first occurrence in the release subpart
                      release_subpart_updated = release_subpart.replace(release_build_type_target, release_build_type_replacement, 1)
                      content = build_types_split[0] + "buildTypes {" + release_split[0] + "release {" + release_subpart_updated
                      print("✅ Patched release build type to use release signing configuration")
                  elif release_build_type_replacement in release_subpart:
                      print("ℹ️ Release build type already uses release signing configuration")
                  else:
                      print("⚠️ Target signing config not found in release build type")
              else:
                  print("⚠️ Release build type block not found")
          else:
              print("⚠️ buildTypes block not found")

          with open(build_gradle_path, "w") as file:
              file.write(content)
          EOF

      - name: Build Android Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PKEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASS="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          EXPO_PUBLIC_QUICKPOSE_SDK_KEY: "01KWJ2D0XS271NBAFJMCXCF950"

      - name: Version and Rename APK file
        run: |
          APK_DIR="mobile/android/app/build/outputs/apk/release"
          mv "$APK_DIR/app-release.apk" "$APK_DIR/fitpilot-v${{ env.VERSION }}-b${{ env.VERSION_CODE }}.apk"
          echo "✅ Renamed APK file successfully"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitpilot-v${{ env.VERSION }}-b${{ env.VERSION_CODE }}
          path: mobile/android/app/build/outputs/apk/release/fitpilot-v${{ env.VERSION }}-b${{ env.VERSION_CODE }}.apk

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: mobile/android/app/build/outputs/apk/release/fitpilot-v${{ env.VERSION }}-b${{ env.VERSION_CODE }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
