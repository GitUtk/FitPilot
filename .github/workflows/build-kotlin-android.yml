name: Build Kotlin Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Sign Kotlin APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Decode Release Keystore Signature
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android-app/app/release.keystore
          echo "✅ Keystore successfully decoded and placed"

      - name: Build Android Release APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PKEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASS="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Rename and Version APK file
        run: |
          APK_DIR="android-app/app/build/outputs/apk/release"
          mv "$APK_DIR/app-release.apk" "$APK_DIR/fitpilot-kotlin.apk"
          echo "✅ Renamed APK file successfully"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitpilot-kotlin
          path: android-app/app/build/outputs/apk/release/fitpilot-kotlin.apk

      - name: Publish Kotlin Release Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-kotlin
          name: Native Kotlin Release v1.0.0
          draft: false
          prerelease: false
          files: android-app/app/build/outputs/apk/release/fitpilot-kotlin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
